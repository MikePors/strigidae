version: 2
updates:
  - package-ecosystem: gomod
    # Dev tools under tools/ are updated by .github/workflows/update-tools.yml,
    # because Dependabot doesn't support go.mod's tool directive.
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(ci)
