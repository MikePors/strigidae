# Example strig config. Copy to $XDG_CONFIG_HOME/strig/config.yml
# (default ~/.config/strig/config.yml), or pass --config <path>.
# See docs/config.md for every key.

# Optional colour theme: a bundled name (strig --list-themes) or the path of a
# Base16/Base24 scheme file. See docs/themes.md.
# theme: tokyo-night

# Optional yes/no options (also `:set` while strig runs). wrapscan and
# hlsearch default to true, wrap and autoviewed to false.
# wrapscan: false
# hlsearch: false
# wrap: true         # wrap long diff lines onto the next rows instead of cutting them off
# autoviewed: true   # m on a file's last unreviewed hunk also marks the file viewed

tabs:
  # Your own PRs. With no "user" and no "sections" a tab gets the default
  # sections for the signed-in user.
  - name: Me

  # A teammate's tab: the same default sections, with their login in place of
  # you.
  - name: Alice
    user: alice

  # A tab with sections of your own. {user} is replaced by the tab's user
  # (@me when the tab has none).
  - name: Team
    user: bob
    sections:
      - name: Needs my review
        query: is:pr is:open review-requested:@me author:{user}
        limit: 50
      - name: Recently merged
        query: is:pr is:merged author:{user}
        limit: 10
        sort: created
        order: desc
